<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VOID RIFT+</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
html, body {
  margin: 0; padding: 0;
  background: radial-gradient(circle at center, #0b0f1a, #000);
  overflow: hidden; font-family: system-ui, sans-serif; color: #fff;
}
canvas { display:block; margin:auto; }
#hud { position:fixed; top:12px; left:12px; font-size:14px; text-shadow:0 0 10px #7df9ff; line-height:1.4 }
#title { position:fixed; top:40%; width:100%; text-align:center; font-size:42px; letter-spacing:4px; text-shadow:0 0 20px #7df9ff }
#overlay { position:fixed; inset:0; display:none; background:rgba(0,0,0,0.8); align-items:center; justify-content:center; flex-direction:column; text-align:center; }
.choice { background:#111; border:1px solid #7df9ff; padding:16px; margin:12px; cursor:pointer; width:220px }
.choice:hover { background:#1b243a }
</style>
</head>
<body>
<div id="hud"></div>
<div id="title">VOID RIFT+<br><span>Click to enter</span></div>
<div id="overlay"></div>
<canvas id="c"></canvas>

<script>
/* ================== SETUP ================== */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const title = document.getElementById('title');
const overlay = document.getElementById('overlay');
canvas.width = innerWidth; canvas.height = innerHeight;

let started=false, time=0, score=0;
let wave=1, enemiesLeft=0, choosing=false;
let pauseTimer=0;
let screenShake=0;
let waveFlash=0;
let slowMoTimer=0; // dramatic slow motion // cool wave pulse

let bulletSize=4, bulletSpeed=12, fireRate=1;
let shield=0;
let diamonds=0; // diamond currency
let combo = 0; // combo meter
let comboTimer = 0; // combo decay
let playerDamage = 1; // FIX: define player damage
let pickupRange = 0; // FIX: used by Magnet upgrade
const starColors = ['#7df9ff', '#ff8fd4', '#ffe066', '#8affc1', '#9d8cff'];
let starColorIndex = 0;

const player={ x:canvas.width/2, y:canvas.height/2, r:12, angle:-Math.PI/2 };
const bullets=[];
const enemies=[];
const diamondsOnMap=[];
const particles=[]; // hit + death particles
const trailParticles=[]; // player thruster trail (visual only)
const stars=[]; // background shooting stars (visual only)
const bgStars=[]; // slow drifting background stars
const keys={};

function rand(a,b){ return Math.random()*(b-a)+a }

function spawnParticles(x,y,color,count,spd){
  for(let i=0;i<count;i++){
    particles.push({
      x,y,
      vx:rand(-spd,spd),
      vy:rand(-spd,spd),
      life:rand(20,40),
      color
    });
  }
}

/* ================== INPUT ================== */
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let targetX=player.x, targetY=player.y, lerpTimer=0;
addEventListener('mousemove',e=>{ targetX=e.clientX; targetY=e.clientY; });
addEventListener('mousedown',()=>{
  if(!started){ started=true; title.remove(); startWave(); return; }
  fire();
});

/* ================== COMBAT ================== */
let autoFire=false, extraTurret=false, petTurret=false, wildcard=false;

function fire(){
  if(!started||choosing) return;
  for(let i=0;i<fireRate;i++){
    bullets.push({x:player.x,y:player.y,vx:Math.cos(player.angle)*bulletSpeed,vy:Math.sin(player.angle)*bulletSpeed,s:bulletSize});
    if(extraTurret) bullets.push({x:player.x,y:player.y,vx:-Math.cos(player.angle)*bulletSpeed,vy:-Math.sin(player.angle)*bulletSpeed,s:bulletSize});
    if(wildcard) bullets.push({x:player.x,y:player.y,vx:rand(-bulletSpeed,bulletSpeed),vy:rand(-bulletSpeed,bulletSpeed),s:bulletSize});
  }
}

/* ================== WAVES & ENEMIES ================== */
function startWave(){ enemiesLeft=5+wave*2;
  waveFlash = 30; // trigger wave pulse
  if(wave % 3 === 0){ starColorIndex = (starColorIndex + 1) % starColors.length; }
  // Spawn diamonds every 2 waves
  if(wave % 2 === 0){ spawnDiamonds(); }
}

function spawnEnemy(){
  if(enemiesLeft<=0) return; enemiesLeft--;
  const edge=Math.floor(Math.random()*4);
  let x=edge<2?(edge?canvas.width:0):rand(0,canvas.width);
  let y=edge>=2?(edge===2?0:canvas.height):rand(0,canvas.height);

  let r=Math.random(), type='orb';
  if(r>0.975) type='splitter';
  else if(r>0.965) type='phantom';
  else if(r>0.94) type='squid';
  else if(r>0.92) type='dasher';
  else if(r>0.6) type='spike';
  else if(r>0.3) type='eye';

  const base={
    orb:{r:14,hp:2,s:0.7},
    spike:{r:16,hp:3,s:0.5,shieldTimer:0,shieldOn:false},
    eye:{r:10,hp:1,s:1.3},
    dasher:{r:14,hp:3,s:0.4,state:'idle',timer:0,dx:0,dy:0,dashDist:160,dashes:0,isBoss:false},
    phantom:{r:11,hp:2,s:1.1,state:'idle',timer:0,dx:0,dy:0},
    squid:{r:14,hp:4,s:0.3,angle:0,spin:0.06,limbLen:220},
    splitter:{r:16,hp:3,s:0.6}
  }[type];

  if(type==='dasher' && wave%10===0){ base.isBoss=true; base.hp=10; base.dashDist=240; }
  enemies.push({x,y,type,...base});
}

/* ================== ABILITIES ================== */
const commonAbilities=[
  {n:'Bigger Bullets',a:()=>bulletSize+=1},
  {n:'Rapid Fire',a:()=>fireRate++},
  {n:'Velocity Rounds',a:()=>bulletSpeed+=3},
  {n:'Shield Charge',a:()=>shield+=2},
  {n:'Damage Up',a:()=>playerDamage++},
  {n:'Magnet',a:()=>pickupRange+=20},

  // --- NEW BALANCED UPGRADES ---
  {n:'Reactive Plating',a:()=>shield+=1}, // small survivability bump
  {n:'Tighter Spread',a:()=>{ bulletSpeed+=1; }}, // indirect DPS, helps accuracy
  {n:'Overclocked Loader',a:()=>{ if(fireRate>1) fireRate--; }}, // mild early-game boost
  {n:'Kinetic Impact',a:()=>{ screenShake=6; }}, // utility / feedback, no raw DPS
  {n:'Void Stability',a:()=>{ player.r+=1; }} // slight hitbox growth tradeoff
];
const specialAbilities=[
  {n:'Wildcard Fire',a:()=>wildcard=true},
  {n:'Extra Turret',a:()=>extraTurret=true},
  {n:'Pet Turret',a:()=>petTurret=true},
];

function chooseAbility(){
  choosing=true; pauseTimer=60;
  overlay.innerHTML='<h2 style="color:#7df9ff">RIFT STABILIZED</h2><p>Choose an augmentation</p>';
  overlay.style.display='flex';

  let pool=[...commonAbilities];
  if(wave%5===0) pool.push(...specialAbilities,...specialAbilities);
  else if(Math.random()<0.15) pool.push(...specialAbilities);

  pool.sort(()=>0.5-Math.random()).slice(0,3).forEach(ab=>{
    const d=document.createElement('div'); d.className='choice'; d.textContent=ab.n; d.style.opacity='0.4';
    if(specialAbilities.includes(ab)){ d.style.borderColor='#ffcc33'; d.style.boxShadow='0 0 18px #ffcc33'; }
    d.onclick=()=>{ if(pauseTimer>0) return; ab.a(); overlay.style.display='none'; choosing=false; lerpTimer=60; wave++; startWave(); };
    overlay.appendChild(d);
  });
}

function spawnDiamonds(){
  const count = 2 + Math.floor(Math.random()*2);
  for(let i=0;i<count;i++){
    diamondsOnMap.push({
      x: rand(40, canvas.width-40),
      y: rand(40, canvas.height-40),
      r: 8
    });
  }
}

/* ================== UPDATE ================== */
function update(){
  if(comboTimer>0) comboTimer--;
  else combo = 0;
  if(slowMoTimer>0){ slowMoTimer--; return; }
  if(pauseTimer>0){ pauseTimer--; return; }
  if(choosing) return;
  if(autoFire) fire();

  if(lerpTimer>0){ player.x+=(targetX-player.x)*0.15; player.y+=(targetY-player.y)*0.15; lerpTimer--; }
  else { player.x=targetX; player.y=targetY; }

  if(keys['a']) player.angle-=0.08; if(keys['d']) player.angle+=0.08;
  time++; if(time%25===0) spawnEnemy();

  bullets.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; });
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    if(b.x < -60 || b.x > canvas.width + 60 || b.y < -60 || b.y > canvas.height + 60){
      bullets.splice(i,1);
    }
  }

  enemies.forEach(e=>{
    // SQUID behavior: spins and sweeps limbs across screen
    if(e.type==='squid'){
      e.angle += e.spin;
      const dx = canvas.width/2 - e.x;
      const dy = canvas.height/2 - e.y;
      const d = Math.hypot(dx,dy)||1;
      e.x += dx/d * e.s;
      e.y += dy/d * e.s;
      return;
    }
    // Brute (spike) shield logic
    if(e.type==='spike'){
      e.shieldTimer++;
      if(e.shieldOn && e.shieldTimer>=120){ e.shieldOn=false; e.shieldTimer=0; }
      else if(!e.shieldOn && e.shieldTimer>=180){ e.shieldOn=true; e.shieldTimer=0; }
    }

    if(e.type==='dasher' || e.type==='phantom'){
      if(e.state==='idle' && Math.random()<0.008){
        const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy)||1;
        e.dx=dx/d; e.dy=dy/d; e.state='windup'; e.timer=30;
      }
      else if(e.state==='windup' && --e.timer<=0){ e.state='dash'; e.timer=(e.type==='phantom'?10:14); }
      else if(e.state==='dash'){
        const dashSpeed = e.type==='phantom'?12:(e.isBoss?8:6);
        e.x+=e.dx*dashSpeed; e.y+=e.dy*dashSpeed;
        screenShake=4;
        if(--e.timer<=0){
          if(e.isBoss && e.dashes<1){
            const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy)||1;
            e.dx=dx/d; e.dy=dy/d; e.state='windup'; e.timer=30; e.dashes++;
          } else { e.state='cooldown'; e.timer=50; e.dashes=0; }
        }
        return;
      }
      else if(e.state==='cooldown' && --e.timer<=0) e.state='idle';
    }

    const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy)||1;
    if(e.type!=='phantom' || e.state==='idle'){
      e.x+=dx/d*e.s; e.y+=dy/d*e.s;
    }
  });

  if(petTurret && time%20===0 && enemies.length){
    const t=enemies.reduce((a,b)=>Math.hypot(player.x-a.x,player.y-a.y)<Math.hypot(player.x-b.x,player.y-b.y)?a:b);
    const dx=t.x-player.x, dy=t.y-player.y, d=Math.hypot(dx,dy)||1;
    bullets.push({x:player.x+20,y:player.y+20,vx:dx/d*bulletSpeed,vy:dy/d*bulletSpeed,s:bulletSize-1});
  }

  // Diamond pickup
for(let i=diamondsOnMap.length-1;i>=0;i--){
  const d = diamondsOnMap[i];
  if(Math.hypot(player.x-d.x, player.y-d.y) < player.r + d.r + pickupRange){
    diamonds++;
    playDiamond();
    diamondsOnMap.splice(i,1);
    if(diamonds % 3 === 0){
      // trigger upgrade choice screen
      choosing = true;
      pauseTimer = 30;
      chooseAbility();
    }
  }
}

for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    for(let j=bullets.length-1;j>=0;j--){
      const b=bullets[j];
      if(Math.hypot(e.x-b.x,e.y-b.y)<e.r){
        bullets.splice(j,1);
        if(e.type==='spike' && e.shieldOn) break;
        e.hp -= playerDamage;
        // hit particles
        spawnParticles(e.x,e.y,
          e.type==='eye'?'#00ffcc':
          e.type==='spike'?'#ff2222':
          e.type==='phantom'?'#66ffff':
          e.type==='squid'?'#aa66ff':'#ff66ff',
          4,2
        );
        if(e.hp<=0){
          // death explosion
          playEnemyDeath();
          spawnParticles(e.x,e.y,
            e.type==='eye'?'#00ffcc':
            e.type==='spike'?'#ff2222':
            e.type==='phantom'?'#66ffff':
            e.type==='squid'?'#aa66ff':'#ff66ff',
            14,4
          );
          // Splitter splits into two eyes
          if(e.type==='splitter'){
            for(let k=0;k<2;k++){
              enemies.push({
                x:e.x+rand(-8,8),
                y:e.y+rand(-8,8),
                type:'eye',
                r:10,hp:1,s:1.3
              });
            }
          }
          enemies.splice(i,1);
          score+=10*wave;
          combo++;
          comboTimer = 180; // 3 seconds to keep combo
        }
        break;
      }
    }
    if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r){ shield>0?(shield--,enemies.splice(i,1)):location.reload(); }
  }

  if(enemiesLeft<=0 && enemies.length===0){ slowMoTimer=20; chooseAbility(); }
}

/* ================== DRAW ================== */

function spawnTrail(x,y){
  // ensure particles always move away from the ship
  const rot = player.angle + Math.PI/2; // ship rotation used for engine glow
  const dirX = -Math.sin(rot);
  const dirY =  Math.cos(rot);
  trailParticles.push({
    x, y,
    vx: dirX * rand(1.5, 3.0) + rand(-0.25, 0.25),
    vy: dirY * rand(1.5, 3.0) + rand(-0.25, 0.25),
    life: 20
  });
}
function drawEnemy(e){
  ctx.save();
  ctx.translate(e.x,e.y);

  // --- ALIEN VISUAL STYLES ---
  if(e.type==='orb'){
    // gelatinous alien blob
    ctx.fillStyle='#b84dff';
    ctx.beginPath(); ctx.arc(0,0,e.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#ff99ff';
    ctx.beginPath(); ctx.arc(0,0,e.r*0.6,0,Math.PI*2); ctx.stroke();
  }
  else if(e.type==='eye'){
    // floating alien eyeball
    ctx.fillStyle='#44ffee';
    ctx.beginPath(); ctx.ellipse(0,0,e.r*1.3,e.r,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath(); ctx.arc(0,0,e.r/2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ff3355';
    ctx.beginPath(); ctx.arc(e.r/6,-e.r/6,e.r/6,0,Math.PI*2); ctx.fill();
  }
  else if(e.type==='spike'){
    // armored alien mine
    ctx.fillStyle='#661111';
    ctx.beginPath(); ctx.arc(0,0,e.r*0.8,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#ff3333';
    for(let a=0;a<Math.PI*2;a+=Math.PI/6){
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*e.r*0.5,Math.sin(a)*e.r*0.5);
      ctx.lineTo(Math.cos(a)*e.r,Math.sin(a)*e.r);
      ctx.stroke();
    }
    if(e.shieldOn){
      ctx.strokeStyle='rgba(80,180,255,0.8)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,0,e.r+6,0,Math.PI*2); ctx.stroke();
      ctx.lineWidth=1;
    }
  }
  else if(e.type==='dasher'){
    // predatory alien dart
    ctx.fillStyle=e.isBoss?'#ff3355':'#ff8844';
    ctx.beginPath();
    ctx.moveTo(0,-e.r);
    ctx.lineTo(e.r,e.r);
    ctx.lineTo(-e.r,e.r);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#000';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,e.r); ctx.stroke();
  }
  else if(e.type==='phantom'){
    // phase-shift alien wraith
    ctx.globalAlpha=0.7;
    ctx.fillStyle='#66ffff';
    ctx.beginPath(); ctx.ellipse(0,0,e.r*1.3,e.r,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(120,255,255,0.8)';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(e.dx*30,e.dy*30); ctx.stroke();
    ctx.globalAlpha=1;
  }
  else if(e.type==='splitter'){
    // unstable alien core
    ctx.fillStyle='#ff66ff';
    ctx.beginPath(); ctx.arc(0,0,e.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#000';
    ctx.beginPath(); ctx.arc(0,0,e.r*0.4,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle='#ffffff55';
    ctx.beginPath(); ctx.arc(0,0,e.r*0.7,0,Math.PI*2); ctx.stroke();
  }
  else if(e.type==='squid'){
    // handled in main draw loop (limb logic)
    ctx.restore();
    return;
  }

  ctx.restore();
}

let petAngle = 0;
function draw(){
  // subtle vignette for tension
  ctx.save();
  const g = ctx.createRadialGradient(player.x,player.y,50,player.x,player.y,Math.max(canvas.width,canvas.height));
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,0.35)');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.restore();
  // --- init background stars if empty ---
  if(bgStars.length < 120){
    for(let i=bgStars.length;i<120;i++){
      bgStars.push({
        x: rand(0, canvas.width),
        y: rand(0, canvas.height),
        s: rand(0.3, 1.2),
        a: rand(0.2, 0.6)
      });
    }
  }

  // --- slowly pan background stars ---
  bgStars.forEach(st=>{
    st.y += st.s * 0.15;
    if(st.y > canvas.height) st.y = -2;
  });
  // --- spawn occasional shooting stars (visual only) ---
  if(Math.random()<0.01){
    stars.push({x:rand(0,canvas.width),y:-20,vx:rand(-1,1),vy:rand(6,10),life:60});
  }
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // --- Wave pulse flash ---
  if(waveFlash>0){
    ctx.globalAlpha = waveFlash/30 * 0.25;
    ctx.fillStyle = starColors[starColorIndex];
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.globalAlpha = 1;
    waveFlash--;
  }
  // --- draw background stars ---
  bgStars.forEach(st=>{
    ctx.globalAlpha = st.a;
    ctx.fillStyle = starColors[starColorIndex];
    ctx.fillRect(st.x, st.y, 1.5, 1.5);
  });
  ctx.globalAlpha = 1;
  // draw background stars
  for(let i=stars.length-1;i>=0;i--){
    const s=stars[i];
    s.x+=s.vx; s.y+=s.vy; s.life--;
    ctx.globalAlpha=Math.max(s.life/60,0);
    ctx.strokeStyle=starColors[starColorIndex];
    ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.vx*6,s.y-s.vy*6); ctx.stroke();
    ctx.globalAlpha=1;
    if(s.life<=0 || s.y>canvas.height+40) stars.splice(i,1);
  }
  if(screenShake>0){ ctx.save(); ctx.translate(rand(-screenShake,screenShake),rand(-screenShake,screenShake)); screenShake*=0.85; }
  // --- Player body (rocket hull) ---
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle + Math.PI/2);
  // hull
  ctx.fillStyle = '#7df9ff';
  ctx.beginPath();
  ctx.moveTo(0, -16);
  ctx.lineTo(10, 12);
  ctx.lineTo(-10, 12);
  ctx.closePath();
  ctx.fill();
  // fins
  ctx.fillStyle = '#4ddfff';
  ctx.beginPath(); ctx.moveTo(-10, 8); ctx.lineTo(-16, 16); ctx.lineTo(-6, 14); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(10, 8); ctx.lineTo(16, 16); ctx.lineTo(6, 14); ctx.closePath(); ctx.fill();
  // cockpit
  ctx.fillStyle = '#002b3a';
  ctx.beginPath(); ctx.arc(0, -4, 4, 0, Math.PI*2); ctx.fill();
  // engine glow
  // spawn trail at the back of the ship (opposite of nose)
  // spawn trail exactly at engine glow position
  // spawn trail locked to engine glow (rotates with ship)
  const rot = player.angle + Math.PI/2;
  spawnTrail(player.x - Math.sin(rot)*14, player.y + Math.cos(rot)*14);
  ctx.fillStyle = 'rgba(255,180,60,0.8)';
  ctx.beginPath(); ctx.arc(0, 14, 4 + Math.random()*2, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // --- Pet turret visual orbit ---
  if(petTurret){
    petAngle += 0.05;
    const ox = player.x + Math.cos(petAngle)*26;
    const oy = player.y + Math.sin(petAngle)*26;
    ctx.fillStyle = '#ffcc33';
    ctx.beginPath(); ctx.arc(ox, oy, 5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#ffcc33';
    ctx.beginPath(); ctx.moveTo(ox, oy);
    ctx.lineTo(ox + Math.cos(petAngle)*10, oy + Math.sin(petAngle)*10);
    ctx.stroke();
  }
  // --- Turret barrel (kept for readability) ---
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(player.x, player.y);
  ctx.lineTo(player.x + Math.cos(player.angle) * 26, player.y + Math.sin(player.angle) * 26);
  ctx.stroke();
  ctx.lineWidth = 1;
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.life--;
    ctx.globalAlpha=Math.max(p.life/40,0);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,2,2);
    ctx.globalAlpha=1;
  });
  
  // player thruster trail
  trailParticles.forEach(t=>{
    t.x+=t.vx; t.y+=t.vy; t.life--;
    ctx.globalAlpha = t.life/20;
    ctx.fillStyle = '#ffb347';
    ctx.fillRect(t.x, t.y, 2, 2);
    ctx.globalAlpha = 1;
  });
  for(let i=trailParticles.length-1;i>=0;i--) if(trailParticles[i].life<=0) trailParticles.splice(i,1);
  for(let i=particles.length-1;i>=0;i--) if(particles[i].life<=0) particles.splice(i,1);
  // --- Combo visual pulse ---
  if(combo>0){
    ctx.save();
    ctx.globalAlpha = Math.min(combo/10,0.4);
    ctx.strokeStyle = '#ffcc33';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r + 10 + combo*2, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  bullets.forEach(b=>ctx.fillRect(b.x-b.s/2,b.y-b.s/2,b.s,b.s));
  // draw enemies (non-squid)
enemies.forEach(drawEnemy);

// --- SQUID DRAW PASS (explicit, always visible) ---
enemies.forEach(e=>{
  if(e.type!=='squid') return;
  ctx.save();
  ctx.translate(e.x,e.y);
  ctx.strokeStyle='rgba(180,120,255,0.9)';
  ctx.lineWidth=3;
  for(let a=0;a<Math.PI*2;a+=Math.PI/4){
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(e.angle+a)*e.limbLen, Math.sin(e.angle+a)*e.limbLen);
    ctx.stroke();
  }
  ctx.fillStyle='#aa66ff';
  ctx.beginPath(); ctx.arc(0,0,e.r,0,Math.PI*2); ctx.fill();
  ctx.restore();
});
  // Draw diamonds
  diamondsOnMap.forEach(d=>{
    ctx.save(); ctx.translate(d.x,d.y);
    ctx.strokeStyle='#7df9ff'; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(0,-d.r); ctx.lineTo(d.r,0); ctx.lineTo(0,d.r); ctx.lineTo(-d.r,0); ctx.closePath();
    ctx.stroke();
    ctx.restore();
  });
  if(screenShake>0) ctx.restore();
  hud.textContent=`Score: ${score}  Wave: ${wave}  Shield: ${shield}  Diamonds: ${diamonds}  Combo: x${combo}`;
}

function loop(){ if(started){ update(); draw(); } requestAnimationFrame(loop); }
loop();

/* ================== AUDIO (ADDITIVE ONLY) ================== */

// --- Enemy death SFX ---
function playEnemyDeath(){
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(220, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.12);
  g.gain.setValueAtTime(0.22, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime + 0.16);
}


// Web Audio setup (no external assets)
const AudioCtx = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioCtx();
let musicStarted = false;

// --- Background music (procedural ambient loop) ---
function startMusic(){
  if(musicStarted) return;
  musicStarted = true;

  const master = audioCtx.createGain();
  master.gain.value = 0.15;
  master.connect(audioCtx.destination);

  // two slow oscillators for ambient drone
  const osc1 = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  osc1.type = 'sawtooth';
  osc2.type = 'triangle';
  osc1.frequency.value = 55;
  osc2.frequency.value = 82.5;

  const lfo = audioCtx.createOscillator();
  const lfoGain = audioCtx.createGain();
  lfo.frequency.value = 0.08;
  lfoGain.gain.value = 18;
  lfo.connect(lfoGain);
  lfoGain.connect(osc1.frequency);

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 420;

  osc1.connect(filter);
  osc2.connect(filter);
  filter.connect(master);

  // --- Upbeat bassline (procedural)
  const bass = audioCtx.createOscillator();
  const bassGain = audioCtx.createGain();
  const bassFilter = audioCtx.createBiquadFilter();
  bass.type = 'square';
  bass.frequency.value = 110; // A2 base
  bassGain.gain.value = 0.0;
  bassFilter.type = 'lowpass';
  bassFilter.frequency.value = 180;
  bass.connect(bassFilter);
  bassFilter.connect(bassGain);
  bassGain.connect(master);

  // simple 8-step bass pattern
  const pattern = [110, 110, 146.8, 110, 164.8, 146.8, 110, 98]; // A2, D3, E3, G2
  let step = 0;
  setInterval(()=>{
    if(!musicStarted) return;
    bass.frequency.setValueAtTime(pattern[step % pattern.length], audioCtx.currentTime);
    bassGain.gain.cancelScheduledValues(audioCtx.currentTime);
    bassGain.gain.setValueAtTime(0.22, audioCtx.currentTime);
    bassGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
    step++;
  }, 240); // upbeat tempo

  // --- Arpeggio lead (sparkle) ---
  const arp = audioCtx.createOscillator();
  const arpGain = audioCtx.createGain();
  const arpFilter = audioCtx.createBiquadFilter();
  arp.type = 'triangle';
  arpFilter.type = 'bandpass';
  arpFilter.frequency.value = 1200;
  arpFilter.Q.value = 0.8;
  arpGain.gain.value = 0.0;
  arp.connect(arpFilter);
  arpFilter.connect(arpGain);
  arpGain.connect(master);
  const arpNotes = [440, 554.37, 659.25, 880]; // A4, C#5, E5, A5
  let aStep = 0;
  setInterval(()=>{
    if(!musicStarted) return;
    arp.frequency.setValueAtTime(arpNotes[aStep % arpNotes.length], audioCtx.currentTime);
    arpGain.gain.cancelScheduledValues(audioCtx.currentTime);
    arpGain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    arpGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
    aStep++;
  }, 120);

  // --- Hi-hat noise (very subtle texture) ---
  const hatBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.03, audioCtx.sampleRate);
  const hatData = hatBuffer.getChannelData(0);
  for(let i=0;i<hatData.length;i++) hatData[i] = (Math.random()*2-1);

  const hatFilter = audioCtx.createBiquadFilter();
  hatFilter.type = 'highpass';
  hatFilter.frequency.value = 6500;

  setInterval(()=>{
    if(!musicStarted) return;

    const src = audioCtx.createBufferSource();
    const g = audioCtx.createGain();

    src.buffer = hatBuffer;

    // EXTREMELY quiet
    g.gain.setValueAtTime(0.004, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.05);

    src.connect(hatFilter);
    hatFilter.connect(g);
    g.connect(master);

    src.start();
    src.stop(audioCtx.currentTime + 0.06);
  }, 180);

  osc1.start(); osc2.start(); lfo.start(); bass.start(); arp.start();
}

// --- Diamond Pickup SFX ---
function playDiamond(){
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(880, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.08);
  g.gain.setValueAtTime(0.18, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime + 0.14);
}

// --- Shooting SFX ---
function playShoot(){
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(420, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.08);
  g.gain.setValueAtTime(0.15, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime + 0.12);
}

// Resume audio + start music on first user interaction
addEventListener('mousedown',()=>{
  if(audioCtx.state !== 'running') audioCtx.resume();
  startMusic();
});

// Monkey‑patch fire() to add SFX without touching original logic
const __fire = fire;
fire = function(){ playShoot(); __fire(); };


/* ================== HOLD-TO-FIRE (ADDITIVE) ================== */
let isMouseDown = false;
let holdCooldown = 0;
const HOLD_FIRE_INTERVAL = 14; // frames between shots (~10/s at 60fps)

addEventListener('mousedown',()=>{ isMouseDown = true; });
addEventListener('mouseup',()=>{ isMouseDown = false; });
addEventListener('mouseleave',()=>{ isMouseDown = false; });

// Inject into update loop without modifying existing logic
const __update = update;
update = function(){
  if(isMouseDown && started && !choosing){
    if(holdCooldown-- <= 0){
      fire();
      holdCooldown = HOLD_FIRE_INTERVAL;
    }
  }
  __update();
};
